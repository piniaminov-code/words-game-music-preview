<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מוזיקה למשחקים - לאישור</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#eefaf0;margin:0;padding:16px;color:#2b1d1a}
main{max-width:560px;margin:0 auto}
h1{color:#0a6b1f;font-size:24px;text-align:center}
.note{text-align:center;color:#555;font-size:14px;margin-bottom:16px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:18px}
.card h2{margin:0 0 8px;font-size:20px}
.card img{width:100%;border-radius:12px;border:1px solid #ddd}
audio{width:100%;margin-top:12px}
.hint{font-size:13px;color:#666;margin-top:6px}
</style></head><body><main>
<h1>🎵 מוזיקה למשחקים - לאישור</h1>
<p class="note">דף תצוגה בלבד. האפליקציה עצמה לא שונתה.</p>
<section class="card" id="stage">
<h2>🗺️ תרגול שלבים</h2>
<img src="stage.jpg" alt="מפת השלבים באפליקציה">
<audio controls preload="none" src="stage-loop-v1.mp3"></audio>
<p class="hint">לולאה אינסטרומנטלית, כ-2.5 דקות, חוזרת על עצמה.</p>
</section>
</main></body></html>
